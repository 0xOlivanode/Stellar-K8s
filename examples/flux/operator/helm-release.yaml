apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stellar-operator
  namespace: stellar-system
spec:
  interval: 10m
  chart:
    spec:
      chart: stellar-operator
      version: ">=4.0.0"
      sourceRef:
        kind: HelmRepository
        name: stellar-k8s
        namespace: stellar-system
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
    operator:
      logLevel: info
      watchNamespace: ""
    sidecar:
      enabled: false
    security:
      podSecurityStandard: restricted
