apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stellar-testnet-validator
  namespace: stellar-testnet
spec:
  interval: 10m
  dependsOn:
    - name: stellar-operator
      namespace: stellar-system
  chart:
    spec:
      chart: ./examples/argocd/v1/node-chart
      sourceRef:
        kind: GitRepository
        name: stellar-k8s
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  valuesFrom:
    - kind: ConfigMap
      name: stellar-testnet-validator-values
      optional: false
  values:
    nodeType: Validator
    network: testnet
    version: v21.0.0
    replicas: 1
    storageClass: standard
    storageSize: 100Gi
    retentionPolicy: Delete
    seedSecret:
      enabled: true
      name: validator-seed-testnet
      key: STELLAR_CORE_SEED
      # Replace with a real seed via SOPS or External Secrets for production.
      value: REPLACE_WITH_A_TESTNET_VALIDATOR_SECRET_KEY
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
